name: Build MetalHud Instant

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Zig Compiler
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.13.0

      - name: Compile iOS Dylib (arm64)
        run: |
          zig cc -x c -target aarch64-ios -dynamiclib -Wl,-undefined,dynamic_lookup -O2 -o MetalHudLoader.dylib init.m

      - name: Upload Dylib Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MetalHudLoader-Mini-FPS
          path: MetalHudLoader.dylib
